<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КотоБлог — прототип интерфейса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app-ui.css">
</head>
<body>

<header class="site-head">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40"><use href="#logo-cat"/></svg>
    </div>
    <div class="brand-text">
      <h1>КотоБлог</h1>
      <p>Прототип интерфейса · альбомная ориентация · дети 7–11 лет</p>
    </div>
  </div>
  <div class="seg" role="tablist" aria-label="Режим просмотра">
    <button class="seg-btn is-on" data-view="device" role="tab">Экран</button>
    <button class="seg-btn" data-view="gallery" role="tab">Все экраны</button>
    <button class="seg-btn" data-view="flow" role="tab">Сценарий</button>
  </div>
</header>

<main class="layout">
  <aside class="rail" id="rail"></aside>

  <section class="stage">
    <div class="view view-device is-on" id="view-device">
      <div class="device-wrap">
        <button class="nudge" id="prevScreen" aria-label="Предыдущий экран">
          <svg class="i"><use href="#i-chev-left"/></svg>
        </button>
        <div class="phone">
          <div class="phone-notch"></div>
          <div class="phone-screen" id="phoneScreen"></div>
        </div>
        <button class="nudge" id="nextScreen" aria-label="Следующий экран">
          <svg class="i"><use href="#i-chev-right"/></svg>
        </button>
      </div>
    </div>

    <div class="view view-gallery" id="view-gallery"><div class="gallery" id="gallery"></div></div>
    <div class="view view-flow" id="view-flow"><div class="flow" id="flow"></div></div>
  </section>

  <aside class="notes" id="notes"></aside>
</main>

<footer class="site-foot">
  Статичный прототип: без игровой логики, экономики и бэкенда.
  Кликабельны меню, навигация, вкладки, переключатели и ползунки бюджета.
</footer>
